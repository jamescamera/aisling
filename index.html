<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>THE 8:15</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --red:#C8402C;
    --cream:#F0E5D2;
    --ink:#1E1E24;
    --steel:#8A8F98;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#B7D3DE}
  body{
    font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
    color:var(--cream);
    -webkit-tap-highlight-color:transparent;
    touch-action:none;
  }
  canvas{display:block;position:fixed;top:0;left:0;width:100%;height:100%;z-index:0}
  #hud{z-index:3}
  .screen{z-index:2}

  #fault{
    position:fixed;left:12px;right:12px;bottom:12px;z-index:9;
    background:#C8402C;color:#fff;padding:12px 14px;
    font-size:11px;line-height:1.5;word-break:break-word;
  }
  #fault[hidden]{display:none}
  #fault b{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;margin-bottom:5px;opacity:.8}

  /* ---- HUD ---- */
  #hud{
    position:fixed;inset:0;pointer-events:none;
    padding:calc(env(safe-area-inset-top) + 14px) 16px 16px;
    display:flex;justify-content:space-between;align-items:flex-start;
    opacity:0;transition:opacity .35s ease;
  }
  #hud.on{opacity:1}
  .readout{
    background:rgba(30,30,36,.82);
    border:1px solid rgba(240,229,210,.18);
    padding:7px 11px 8px;
  }
  .label{
    font-size:9px;letter-spacing:.22em;text-transform:uppercase;
    color:rgba(240,229,210,.55);
  }
  .value{
    font-family:"Oswald",Impact,sans-serif;
    font-weight:600;font-size:30px;line-height:1;letter-spacing:.03em;
    font-variant-numeric:tabular-nums;
  }
  #best .value{font-size:18px;color:rgba(240,229,210,.8)}

  /* ---- overlays ---- */
  .screen{
    position:fixed;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:22px;padding:28px;
    background:radial-gradient(120% 90% at 50% 40%,rgba(30,30,36,.55),rgba(30,30,36,.9));
    text-align:center;
  }
  .screen[hidden]{display:none}

  .plate{
    background:var(--ink);
    border:2px solid var(--cream);
    padding:16px 26px 18px;
    box-shadow:0 10px 0 rgba(0,0,0,.25);
  }
  .plate h1{
    font-family:"Oswald",Impact,sans-serif;
    font-weight:600;font-size:clamp(38px,13vw,72px);line-height:.92;
    letter-spacing:.04em;text-transform:uppercase;
  }
  .plate .sub{
    margin-top:6px;font-size:10px;letter-spacing:.34em;
    text-transform:uppercase;color:var(--red);
  }

  .rules{
    display:grid;gap:7px;font-size:12px;line-height:1.45;
    color:rgba(240,229,210,.85);max-width:300px;
  }
  .rules b{color:var(--cream);font-weight:500}

  .stub{
    background:var(--cream);color:var(--ink);
    padding:18px 24px 20px;min-width:230px;
    border-radius:2px;
    box-shadow:0 10px 0 rgba(0,0,0,.25);
  }
  .stub .term{
    font-family:"Oswald",Impact,sans-serif;font-weight:600;
    font-size:19px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);
  }
  .stub hr{border:0;border-top:1px dashed rgba(30,30,36,.35);margin:11px 0}
  .stub .row{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;letter-spacing:.12em;text-transform:uppercase}
  .stub .row span:last-child{font-family:"Oswald",Impact,sans-serif;font-size:24px;letter-spacing:.02em}
  .stub .note{margin-top:10px;font-size:9px;letter-spacing:.18em;color:rgba(30,30,36,.55);text-transform:uppercase}

  button{
    font-family:"Oswald",Impact,sans-serif;font-weight:600;
    font-size:15px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--ink);background:var(--red);
    border:0;padding:14px 30px;cursor:pointer;
    box-shadow:0 5px 0 #8E2A1B;
    color:var(--cream);
  }
  button:active{transform:translateY(3px);box-shadow:0 2px 0 #8E2A1B}
  button:focus-visible{outline:3px solid var(--cream);outline-offset:3px}

  .keys{font-size:10px;letter-spacing:.2em;color:rgba(240,229,210,.6);text-transform:uppercase}

  @media (prefers-reduced-motion:reduce){
    #hud{transition:none}
  }
</style>
</head>
<body>

<div id="hud">
  <div class="readout" id="dist">
    <div class="label">Miles run</div>
    <div class="value" id="distVal">0.0</div>
  </div>
  <div class="readout" id="best">
    <div class="label">Best</div>
    <div class="value" id="bestVal">0.0</div>
  </div>
</div>

<div class="screen" id="titleScreen">
  <div class="plate">
    <h1>The&nbsp;8:15</h1>
    <div class="sub">Line open &middot; run it</div>
  </div>
  <div class="rules">
    <div><b>&larr; &rarr;</b> switch track &mdash; buffers won't move</div>
    <div><b>&uarr;</b> jump the sleepers on the rails</div>
    <div><b>&darr;</b> drop the funnel for low bridges</div>
  </div>
  <button id="startBtn">Depart</button>
  <div class="keys">Or swipe &mdash; left, right, up, down</div>
</div>

<div class="screen" id="overScreen" hidden>
  <div class="stub">
    <div class="term">Service terminated</div>
    <hr>
    <div class="row"><span>Miles</span><span id="finalVal">0.0</span></div>
    <div class="row" style="margin-top:8px"><span>Best</span><span id="finalBest">0.0</span></div>
    <div class="note" id="finalNote">Signal passed at danger</div>
  </div>
  <button id="againBtn">Run again</button>
  <div class="keys">Space to depart</div>
</div>

<div id="fault" hidden><b>Fault report</b><span id="faultMsg"></span></div>

<script>
  function showFault(msg) {
    var f = document.getElementById('fault');
    document.getElementById('faultMsg').textContent = msg;
    f.hidden = false;
  }
  window.addEventListener('error', function (e) {
    showFault((e.message || 'Unknown error') + (e.filename ? ' — ' + e.filename.split('/').pop() : '') + (e.lineno ? ':' + e.lineno : ''));
  });

  // three.js, with a spare source if the first host is unreachable
  function loadThree(urls, done) {
    if (!urls.length) { showFault('three.js could not be loaded from any source. Check the connection or VPN/blocker.'); return; }
    var s = document.createElement('script');
    s.src = urls[0];
    s.onload = function () {
      if (!window.THREE) { loadThree(urls.slice(1), done); return; }
      try { done(); } catch (err) { showFault('Boot failed: ' + err.message); }
    };
    s.onerror = function () { loadThree(urls.slice(1), done); };
    document.head.appendChild(s);
  }
</script>

<script>
function boot() {
  'use strict';

  // ---------------------------------------------------------------- config
  var LANE_X   = [-3.4, 0, 3.4];
  var SEG_LEN  = 48;      // ground segment length
  var SEG_N    = 7;       // ground segments in rotation
  var SPAWN_Z  = -140;    // where obstacles appear
  var KILL_Z   = 22;      // where they get recycled
  var SPEED_0  = 17;
  var SPEED_MAX= 46;
  var ACCEL    = 0.42;    // units/sec per sec
  var GRAV     = 27;
  var JUMP_V   = 9.6;
  var DUCK_T   = 0.58;

  var COL = {
    sky:    0xB7D3DE,
    grass:  0x6E9A5E,
    grass2: 0x5D8850,
    hill:   0x87A97A,
    ballast:0x8C8377,
    sleeper:0x5A4A3C,
    rail:   0x9AA0A6,
    red:    0xC8402C,
    cream:  0xF0E5D2,
    ink:    0x2A2A31,
    stone:  0x9A9AA2,
    wood:   0x6B4F35,
    leaf:   0x4E7A46
  };

  var reduceMotion = window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------------------------------------------------------------- three
  var scene = new THREE.Scene();
  scene.background = new THREE.Color(COL.sky);
  scene.fog = new THREE.Fog(COL.sky, 45, 135);

  var camera = new THREE.PerspectiveCamera(58, 1, 0.1, 400);
  camera.position.set(0, 5.4, 10.5);
  camera.lookAt(0, 1.6, -10);

  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (err) {
    showFault('WebGL unavailable in this browser: ' + err.message);
    return;
  }
  renderer.setClearColor(COL.sky, 1);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  document.body.appendChild(renderer.domElement);

  var hemi = new THREE.HemisphereLight(0xDDEBF2, 0x4C6642, 0.95);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xFFF3DE, 0.85);
  sun.position.set(-8, 14, 4);
  scene.add(sun);

  function mat(color) {
    return new THREE.MeshLambertMaterial({ color: color, flatShading: true });
  }
  var M = {
    grass:  mat(COL.grass),
    grass2: mat(COL.grass2),
    hill:   mat(COL.hill),
    ballast:mat(COL.ballast),
    sleeper:mat(COL.sleeper),
    rail:   mat(COL.rail),
    red:    mat(COL.red),
    cream:  mat(COL.cream),
    ink:    mat(COL.ink),
    stone:  mat(COL.stone),
    wood:   mat(COL.wood),
    leaf:   mat(COL.leaf)
  };

  function box(w, h, d, material) {
    return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), material);
  }

  // ---------------------------------------------------------------- world
  var world = new THREE.Group();
  scene.add(world);

  var segments = [];

  function buildSegment() {
    var g = new THREE.Group();

    var grass = box(90, 0.6, SEG_LEN, M.grass);
    grass.position.y = -0.3;
    g.add(grass);

    // ballast bed under all three tracks
    var bed = box(13.2, 0.36, SEG_LEN, M.ballast);
    bed.position.y = 0.02;
    g.add(bed);

    // sleepers + rails per lane
    for (var l = 0; l < 3; l++) {
      var x = LANE_X[l];
      for (var s = 0; s < 12; s++) {
        var sl = box(2.7, 0.16, 0.5, M.sleeper);
        sl.position.set(x, 0.24, -SEG_LEN / 2 + 2 + s * 4);
        g.add(sl);
      }
      for (var r = -1; r <= 1; r += 2) {
        var rail = box(0.16, 0.16, SEG_LEN, M.rail);
        rail.position.set(x + r * 0.85, 0.36, 0);
        g.add(rail);
      }
    }

    // scenery slots — re-randomised on recycle
    g.userData.props = [];
    for (var p = 0; p < 6; p++) {
      var prop = new THREE.Group();
      var kind = p % 3;
      if (kind === 0) {
        var trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.3, 1.6, 6), M.wood);
        trunk.position.y = 0.8;
        var top = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3.4, 6), M.leaf);
        top.position.y = 3.1;
        prop.add(trunk, top);
      } else if (kind === 1) {
        var hill = new THREE.Mesh(new THREE.ConeGeometry(6, 4.5, 5), M.hill);
        hill.position.y = 1.6;
        prop.add(hill);
      } else {
        var pole = new THREE.Mesh(new THREE.CylinderGeometry(0.14, 0.18, 5, 5), M.wood);
        pole.position.y = 2.5;
        var arm = box(2.2, 0.14, 0.14, M.wood);
        arm.position.y = 4.5;
        prop.add(pole, arm);
      }
      g.userData.props.push(prop);
      g.add(prop);
    }
    return g;
  }

  function dressSegment(g) {
    var props = g.userData.props;
    for (var i = 0; i < props.length; i++) {
      var side = i % 2 === 0 ? -1 : 1;
      var far = 9 + Math.random() * 26;
      props[i].position.set(side * far, 0, -SEG_LEN / 2 + Math.random() * SEG_LEN);
      var sc = 0.7 + Math.random() * 0.8;
      props[i].scale.set(sc, sc, sc);
      props[i].rotation.y = Math.random() * Math.PI;
      props[i].visible = Math.random() > 0.25;
    }
  }

  for (var i = 0; i < SEG_N; i++) {
    var seg = buildSegment();
    seg.position.z = -i * SEG_LEN;
    dressSegment(seg);
    segments.push(seg);
    world.add(seg);
  }

  // ---------------------------------------------------------------- train
  var train = new THREE.Group();
  scene.add(train);

  var engine = new THREE.Group();
  train.add(engine);

  var boilerGeo = new THREE.CylinderGeometry(0.62, 0.62, 2.6, 10);
  boilerGeo.rotateX(Math.PI / 2);
  var boiler = new THREE.Mesh(boilerGeo, M.red);
  boiler.position.set(0, 1.05, -0.35);
  engine.add(boiler);

  var smokebox = new THREE.Mesh(new THREE.CylinderGeometry(0.66, 0.66, 0.34, 10), M.ink);
  smokebox.geometry.rotateX(Math.PI / 2);
  smokebox.position.set(0, 1.05, -1.7);
  engine.add(smokebox);

  var cab = box(1.5, 1.25, 1.3, M.cream);
  cab.position.set(0, 1.28, 1.15);
  engine.add(cab);
  var cabRoof = box(1.7, 0.16, 1.5, M.ink);
  cabRoof.position.set(0, 1.98, 1.15);
  engine.add(cabRoof);
  var window0 = box(1.52, 0.5, 0.06, M.ink);
  window0.position.set(0, 1.55, 0.5);
  engine.add(window0);

  var frame = box(1.9, 0.5, 4.2, M.ink);
  frame.position.set(0, 0.6, 0);
  engine.add(frame);
  var stripe = box(1.92, 0.12, 4.22, M.cream);
  stripe.position.set(0, 0.82, 0);
  engine.add(stripe);

  var bufferBeam = box(2.1, 0.4, 0.2, M.red);
  bufferBeam.position.set(0, 0.72, -2.05);
  engine.add(bufferBeam);

  // the funnel — this is the bit that folds down for low bridges
  var funnel = new THREE.Group();
  var stack = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.38, 0.85, 8), M.ink);
  stack.position.y = 0.42;
  var lip = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.34, 0.16, 8), M.ink);
  lip.position.y = 0.86;
  funnel.add(stack, lip);
  funnel.position.set(0, 1.55, -1.35);
  engine.add(funnel);

  var dome = new THREE.Mesh(new THREE.SphereGeometry(0.3, 8, 6), M.cream);
  dome.position.set(0, 1.6, -0.2);
  engine.add(dome);

  var wheels = [];
  var wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.22, 10);
  wheelGeo.rotateZ(Math.PI / 2);
  for (var w = 0; w < 6; w++) {
    var wheel = new THREE.Mesh(wheelGeo, M.ink);
    wheel.position.set(w % 2 === 0 ? -0.95 : 0.95, 0.42, -1.25 + Math.floor(w / 2) * 1.3);
    engine.add(wheel);
    wheels.push(wheel);
  }

  // two wagons that trail the engine through lane changes
  var wagons = [];
  for (var c = 0; c < 2; c++) {
    var wag = new THREE.Group();
    var body = box(1.7, 1.1, 2.4, c === 0 ? M.ink : M.red);
    body.position.y = 1.15;
    var base = box(1.9, 0.4, 2.6, M.ink);
    base.position.y = 0.6;
    var trim = box(1.72, 0.1, 2.42, M.cream);
    trim.position.y = 1.62;
    wag.add(body, base, trim);
    for (var ww = 0; ww < 4; ww++) {
      var wl = new THREE.Mesh(wheelGeo, M.ink);
      wl.position.set(ww % 2 === 0 ? -0.95 : 0.95, 0.42, ww < 2 ? -0.85 : 0.85);
      wag.add(wl);
      wheels.push(wl);
    }
    wag.position.z = 3.6 + c * 3.1;
    scene.add(wag);
    wagons.push(wag);
  }
  var trail = [];   // history of engine x for the wagons to follow

  // ---------------------------------------------------------------- steam
  var steamMat = new THREE.MeshBasicMaterial({ color: 0xFFFFFF, transparent: true, opacity: 0.85 });
  var steamGeo = new THREE.SphereGeometry(0.34, 6, 5);
  var steam = [];
  for (var s2 = 0; s2 < 34; s2++) {
    var puff = new THREE.Mesh(steamGeo, steamMat.clone());
    puff.visible = false;
    scene.add(puff);
    steam.push({ mesh: puff, life: 0, vy: 0 });
  }
  var steamCursor = 0;
  function puffSteam(x, y, z, power) {
    var p = steam[steamCursor];
    steamCursor = (steamCursor + 1) % steam.length;
    p.mesh.position.set(x + (Math.random() - 0.5) * 0.2, y, z);
    p.mesh.scale.setScalar(0.5 + Math.random() * 0.3);
    p.mesh.visible = true;
    p.life = 1;
    p.vy = 1.6 + Math.random() * 1.2 + power;
  }

  // ---------------------------------------------------------------- obstacles
  var obstacles = [];
  var railGap = 1.9;   // half-width of a lane's danger zone

  function makeBuffer() {
    var g = new THREE.Group();
    var post = box(2.6, 1.5, 0.7, M.ink);
    post.position.y = 0.95;
    g.add(post);
    for (var i2 = 0; i2 < 4; i2++) {
      var band = box(0.6, 1.1, 0.76, i2 % 2 === 0 ? M.red : M.cream);
      band.position.set(-0.95 + i2 * 0.63, 1.05, 0);
      g.add(band);
    }
    var cap = box(2.8, 0.28, 0.9, M.red);
    cap.position.y = 1.85;
    g.add(cap);
    return g;
  }

  function makeSleeperPile() {
    var g = new THREE.Group();
    for (var i3 = 0; i3 < 3; i3++) {
      var lg = box(2.9, 0.32, 0.55, M.wood);
      lg.position.set((Math.random() - 0.5) * 0.3, 0.3 + i3 * 0.22, (i3 - 1) * 0.26);
      lg.rotation.y = (Math.random() - 0.5) * 0.25;
      g.add(lg);
    }
    return g;
  }

  function makeBridge() {
    var g = new THREE.Group();
    var deck = box(24, 1.1, 1.8, M.stone);
    deck.position.y = 3.35;
    g.add(deck);
    var para = box(24, 0.5, 0.4, M.cream);
    para.position.set(0, 4.05, -0.75);
    g.add(para);
    for (var side = -1; side <= 1; side += 2) {
      var pier = box(2.4, 3, 2.4, M.stone);
      pier.position.set(side * 8.4, 1.5, 0);
      g.add(pier);
    }
    for (var l2 = 0; l2 < 3; l2++) {
      var arch = box(2.6, 0.4, 1.9, M.ink);
      arch.position.set(LANE_X[l2], 2.6, 0);
      g.add(arch);
    }
    return g;
  }

  function spawn(type, lane) {
    var mesh;
    if (type === 'buffer') mesh = makeBuffer();
    else if (type === 'pile') mesh = makeSleeperPile();
    else mesh = makeBridge();

    mesh.position.set(type === 'bridge' ? 0 : LANE_X[lane], 0, SPAWN_Z);
    scene.add(mesh);
    obstacles.push({ mesh: mesh, type: type, lane: lane });
  }

  function spawnPattern(dist) {
    var roll = Math.random();
    var lanes = [0, 1, 2];

    if (roll < 0.28) {
      // block two tracks — one way through
      var free = Math.floor(Math.random() * 3);
      for (var i4 = 0; i4 < 3; i4++) if (i4 !== free) spawn('buffer', i4);
    } else if (roll < 0.46) {
      spawn('buffer', Math.floor(Math.random() * 3));
      if (dist > 900 && Math.random() < 0.5) {
        var other = lanes.filter(function (n) { return n !== 0; });
        spawn('pile', other[Math.floor(Math.random() * other.length)]);
      }
    } else if (roll < 0.7) {
      // sleepers dumped on the rails — jump them
      var many = dist > 700 && Math.random() < 0.45;
      if (many) {
        for (var i5 = 0; i5 < 3; i5++) spawn('pile', i5);
      } else {
        var a = Math.floor(Math.random() * 3);
        spawn('pile', a);
        if (Math.random() < 0.5) spawn('pile', (a + 1) % 3);
      }
    } else {
      spawn('bridge', null);
    }
  }

  // ---------------------------------------------------------------- state
  var state = 'title';
  var lane = 1, laneX = 0;
  var py = 0, vy = 0, airborne = false;
  var ducking = false, duckT = 0;
  var speed = SPEED_0, dist = 0, best = 0;
  var nextSpawn = -60;
  var shake = 0, crashT = 0;
  var chuff = 0;

  var hud       = document.getElementById('hud');
  var distVal   = document.getElementById('distVal');
  var bestVal   = document.getElementById('bestVal');
  var finalVal  = document.getElementById('finalVal');
  var finalBest = document.getElementById('finalBest');
  var finalNote = document.getElementById('finalNote');
  var titleScreen = document.getElementById('titleScreen');
  var overScreen  = document.getElementById('overScreen');

  function miles(d) { return (d / 100).toFixed(1); }

  function reset() {
    for (var i6 = obstacles.length - 1; i6 >= 0; i6--) scene.remove(obstacles[i6].mesh);
    obstacles.length = 0;
    lane = 1; laneX = 0; py = 0; vy = 0;
    airborne = false; ducking = false; duckT = 0;
    speed = SPEED_0; dist = 0; nextSpawn = -60;
    shake = 0; crashT = 0;
    train.rotation.set(0, 0, 0);
    trail.length = 0;
    distVal.textContent = '0.0';
  }

  function start() {
    reset();
    state = 'running';
    titleScreen.hidden = true;
    overScreen.hidden = true;
    hud.classList.add('on');
  }

  function crash(reason) {
    state = 'over';
    crashT = 0;
    shake = reduceMotion ? 0 : 1;
    if (dist > best) best = dist;
    bestVal.textContent = miles(best);
    finalVal.textContent = miles(dist);
    finalBest.textContent = miles(best);
    finalNote.textContent = reason;
    setTimeout(function () {
      if (state === 'over') { overScreen.hidden = false; }
    }, 700);
  }

  // ---------------------------------------------------------------- input
  function moveLane(dir) {
    if (state !== 'running') return;
    lane = Math.max(0, Math.min(2, lane + dir));
  }
  function jump() {
    if (state !== 'running' || airborne) return;
    airborne = true; vy = JUMP_V; ducking = false; duckT = 0;
    puffSteam(train.position.x, 2.6, train.position.z - 1.35, 2.5);
  }
  function duck() {
    if (state !== 'running' || airborne) return;
    if (!ducking) puffSteam(train.position.x, 2.2, train.position.z - 1.35, 1.5);
    ducking = true; duckT = DUCK_T;
  }
  function confirm() {
    if (state === 'title') start();
    else if (state === 'over' && !overScreen.hidden) start();
  }

  window.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowLeft' || k === 'a' || k === 'A') { moveLane(-1); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'd' || k === 'D') { moveLane(1); e.preventDefault(); }
    else if (k === 'ArrowUp' || k === 'w' || k === 'W') { jump(); e.preventDefault(); }
    else if (k === 'ArrowDown' || k === 's' || k === 'S') { duck(); e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') {
      if (state === 'running') jump(); else confirm();
      e.preventDefault();
    }
  });

  var tx = 0, ty = 0, touching = false;
  window.addEventListener('touchstart', function (e) {
    var t = e.changedTouches[0];
    tx = t.clientX; ty = t.clientY; touching = true;
  }, { passive: true });
  window.addEventListener('touchend', function (e) {
    if (!touching) return;
    touching = false;
    var t = e.changedTouches[0];
    var dx = t.clientX - tx, dy = t.clientY - ty;
    if (Math.abs(dx) < 28 && Math.abs(dy) < 28) return;
    if (Math.abs(dx) > Math.abs(dy)) moveLane(dx > 0 ? 1 : -1);
    else if (dy < 0) jump();
    else duck();
  }, { passive: true });

  document.getElementById('startBtn').addEventListener('click', start);
  document.getElementById('againBtn').addEventListener('click', start);

  // ---------------------------------------------------------------- loop
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  }
  window.addEventListener('resize', resize);
  resize();

  var last = performance.now();

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    var rolling = state === 'running';
    var moveSpeed = rolling ? speed : (state === 'over' ? Math.max(0, speed * (1 - crashT * 2.2)) : SPEED_0 * 0.35);

    if (rolling) {
      speed = Math.min(SPEED_MAX, speed + ACCEL * dt);
      dist += speed * dt;
      distVal.textContent = miles(dist);
    }
    if (state === 'over') crashT += dt;

    // ground
    for (var i7 = 0; i7 < segments.length; i7++) {
      var sg = segments[i7];
      sg.position.z += moveSpeed * dt;
      if (sg.position.z > SEG_LEN) {
        sg.position.z -= SEG_LEN * SEG_N;
        dressSegment(sg);
      }
    }

    // obstacles
    for (var i8 = obstacles.length - 1; i8 >= 0; i8--) {
      var ob = obstacles[i8];
      ob.mesh.position.z += moveSpeed * dt;
      if (ob.mesh.position.z > KILL_Z) {
        scene.remove(ob.mesh);
        obstacles.splice(i8, 1);
      }
    }

    if (rolling) {
      nextSpawn += speed * dt;
      var gap = 30 + speed * 0.62 + Math.random() * 8;
      if (nextSpawn > gap) {
        nextSpawn = 0;
        spawnPattern(dist);
      }
    }

    // ---- train motion
    var targetX = LANE_X[lane];
    laneX += (targetX - laneX) * Math.min(1, dt * 11);
    train.position.x = laneX;

    if (airborne) {
      vy -= GRAV * dt;
      py += vy * dt;
      if (py <= 0) { py = 0; vy = 0; airborne = false; }
    }
    train.position.y = py;

    if (ducking) {
      duckT -= dt;
      if (duckT <= 0) ducking = false;
    }
    var fold = ducking ? 1 : 0;
    funnel.scale.y += ((fold ? 0.12 : 1) - funnel.scale.y) * Math.min(1, dt * 18);
    funnel.position.y += ((fold ? 1.12 : 1.55) - funnel.position.y) * Math.min(1, dt * 18);
    cabRoof.position.y += ((fold ? 1.62 : 1.98) - cabRoof.position.y) * Math.min(1, dt * 18);
    cab.scale.y += ((fold ? 0.62 : 1) - cab.scale.y) * Math.min(1, dt * 18);

    // lean into the turn
    var lean = (targetX - laneX) * 0.09;
    if (state !== 'over') train.rotation.z += (lean - train.rotation.z) * Math.min(1, dt * 8);
    else { train.rotation.z += dt * 1.6; train.position.y = Math.max(-1, train.position.y - dt * 1.4); }

    // wagons trail behind
    trail.unshift(laneX);
    if (trail.length > 60) trail.pop();
    for (var c2 = 0; c2 < wagons.length; c2++) {
      var idx = Math.min(trail.length - 1, 9 + c2 * 9);
      wagons[c2].position.x = trail[idx];
      wagons[c2].position.y = state === 'over' ? Math.max(-1, wagons[c2].position.y - dt * 0.9) : 0;
      wagons[c2].position.z = 3.6 + c2 * 3.1;
    }

    // wheels
    for (var i9 = 0; i9 < wheels.length; i9++) wheels[i9].rotation.x += moveSpeed * dt * 2.4;

    // steam
    chuff -= dt;
    if (chuff <= 0 && state !== 'over') {
      chuff = Math.max(0.045, 0.5 - moveSpeed * 0.008);
      puffSteam(train.position.x, funnel.position.y + train.position.y + 0.9, train.position.z - 1.35, 0);
    }
    for (var i10 = 0; i10 < steam.length; i10++) {
      var p2 = steam[i10];
      if (p2.life <= 0) continue;
      p2.life -= dt * 0.75;
      p2.mesh.position.y += p2.vy * dt;
      p2.mesh.position.z += (moveSpeed * 0.55 + 3) * dt;
      p2.mesh.scale.multiplyScalar(1 + dt * 1.4);
      p2.mesh.material.opacity = Math.max(0, p2.life) * 0.8;
      if (p2.life <= 0) p2.mesh.visible = false;
    }

    // ---- collisions
    if (rolling) {
      for (var i11 = 0; i11 < obstacles.length; i11++) {
        var o = obstacles[i11];
        var oz = o.mesh.position.z;
        if (oz < -2.6 || oz > 1.8) continue;

        if (o.type === 'bridge') {
          if (py > 0.35) { crash('Struck the bridge — nose too high'); break; }
          if (!ducking)  { crash('Funnel clipped the low bridge'); break; }
        } else {
          if (Math.abs(o.mesh.position.x - laneX) > railGap) continue;
          if (o.type === 'buffer') { crash('Ran into the buffers'); break; }
          if (o.type === 'pile' && py < 0.85) { crash('Sleepers on the rails'); break; }
        }
      }
    }

    // ---- camera
    var camX = laneX * 0.42;
    camera.position.x += (camX - camera.position.x) * Math.min(1, dt * 5);
    camera.position.y += ((5.4 + py * 0.35) - camera.position.y) * Math.min(1, dt * 5);
    if (shake > 0) {
      shake = Math.max(0, shake - dt * 1.6);
      camera.position.x += (Math.random() - 0.5) * shake * 0.9;
      camera.position.y += (Math.random() - 0.5) * shake * 0.9;
    }
    camera.lookAt(laneX * 0.5, 1.6 + py * 0.3, -12);

    renderer.render(scene, camera);
  }

  requestAnimationFrame(frame);
}

loadThree([

  'https://unpkg.com/three@0.128.0/build/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
], boot);
</script>
